name: CPU validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: CayleyValidation
      - uses: actions/checkout@v5
        with:
          repository: alikaperdue/CayleyKernel
          ref: 12850af9feab89b5fb9993feeae2d8f8b0e3c0e5
          path: CayleyKernel
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install both checkouts
        working-directory: CayleyValidation
        run: python -m pip install -e ../CayleyKernel -e '.[test,research-test]'
      - name: Run fast host tests
        working-directory: CayleyValidation
        env:
          CAYLEY_KERNEL_CPU_BACKEND: python
        run: python -m pytest -q -m 'cpu and not slow' tests/
